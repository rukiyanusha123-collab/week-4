<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Explorer</title>
<style>
body{
    font-family: Arial;
    padding:20px;
}
h1{
    background-color: rgb(215, 135, 77);
    border-radius: 5px;
    margin-top: 20px;
}
#products{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}
.card{
    width:200px;
    border:1px solid black;
    padding:10px;
    text-align:center;
    border-radius: 15px;
    margin-top: 30px;
}
.card:hover{
    transform:translateY(-5px);
}

img{
    width:100px;
    height:100px;
}
input:focus{
    background-color:#FFD1DC;
}
input{
    width: 450px;
    height: 35px;
    border-radius: 10px;
    border: balck 2px solid;
}
button{
    padding: 8px 50px;
    border-radius: 5px;
    background-color:#2c3e50;
    color: white;
}
</style>
</head>
<body>

<h1>Product Explorer</h1>

<input type="text" id="search" placeholder="Search product!...">

<button onclick="searchProducts()">Search</button>

<p id="loading"></p>
<p id="error"></p>

<div id="products"></div>

<script src="script.js"></script>

</body>
</html>
